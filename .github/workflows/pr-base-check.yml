name: Retarget PRs to develop

on:
  pull_request_target:
    types: [opened, reopened]
    branches: [main]

permissions:
  pull-requests: write

jobs:
  retarget:
    if: github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr edit "$PR" --repo "$REPO" --base develop
          gh pr comment "$PR" --repo "$REPO" --body "Hi @${{ github.event.pull_request.user.login }}, thanks for the PR! I've retargeted it from \`main\` to \`develop\` — \`main\` only receives release merges from maintainers. See [CONTRIBUTING.md](https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md#branch-model) for the branch model. No action needed on your end."
