<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:head>
        <title>Ticket</title>
    </h:head>

    <h:body>

        <h:form id="ticketForm">
            <h:outputLabel for="reference" value="Reference" />
            <h:inputText id="reference" value="#{ticketBean.reference}"
                converter="uuidConverter" required="true" />
            <h:message for="reference" />

            <h:outputLabel for="subject" value="Subject" />
            <h:inputText id="subject" value="#{ticketBean.subject}" required="true" />
            <h:message for="subject" />

            <h:commandButton id="submit" value="Submit" action="#{ticketBean.submit}" />

            <h:messages id="messages" redisplay="false" />
        </h:form>

    </h:body>

</html>
